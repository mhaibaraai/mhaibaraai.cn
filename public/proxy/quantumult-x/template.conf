# YiXuan 的 Quantumult X 配置模板（脱敏）
# 说明：https://mhaibaraai.cn/config/quantumult-x
# 使用前将 YOUR_SUBSCRIPTION_URL 替换为你的机场订阅地址

[general]
network_check_url=http://www.gstatic.com/generate_204
server_check_url=http://www.gstatic.com/generate_204
excluded_routes=192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8

[dns]
server=223.5.5.5
server=119.29.29.29

[policy]
static=Proxy, Auto, HK, JP, US, direct
url-latency-benchmark=Auto, server-tag-regex=.*, check-interval=600, tolerance=50
url-latency-benchmark=HK, server-tag-regex=(?i)港|HK|Hong, check-interval=600, tolerance=50
url-latency-benchmark=JP, server-tag-regex=(?i)日本|JP|Japan, check-interval=600, tolerance=50
url-latency-benchmark=US, server-tag-regex=(?i)美|US|United States, check-interval=600, tolerance=50
static=AI, US, JP, Proxy
static=Final, Proxy, direct

[server_remote]
YOUR_SUBSCRIPTION_URL, tag=Subscription, update-interval=86400, opt-parser=true, enabled=true

[filter_remote]
https://mhaibaraai.cn/proxy/rules/quantumult-x/ai.list, tag=AI, force-policy=AI, update-interval=86400, opt-parser=false, enabled=true
https://mhaibaraai.cn/proxy/rules/quantumult-x/dev.list, tag=Dev, force-policy=Proxy, update-interval=86400, opt-parser=false, enabled=true
https://mhaibaraai.cn/proxy/rules/quantumult-x/direct.list, tag=Direct, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true

[rewrite_remote]

[server_local]

[filter_local]
host-suffix, local, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
geoip, cn, direct
final, Final

[rewrite_local]

[task_local]

[mitm]
